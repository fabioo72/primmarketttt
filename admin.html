<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | PrimeMarket</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            display: block;
        }

        .nav-item {
            display: block;
            padding: 12px 16px;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .nav-item.active,
        .nav-item:hover {
            background: var(--surface-hover);
            color: white;
        }

        .admin-content {
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: var(--radius-md);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .orders-table th,
        .orders-table td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .orders-table th {
            background: var(--surface-hover);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .orders-table tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-paid {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <a href="/" class="sidebar-brand">
                <span class="text-gradient">Prime</span>Admin
            </a>

            <nav>
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Orders</a>
                <a href="#" class="nav-item">Products</a>
                <a href="#" class="nav-item">Tickets</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="header">
                <h2>Dashboard</h2>
                <button class="btn btn-outline" onclick="clearData()">Reset Demo Data</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value" id="total-revenue">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value" id="total-orders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Tickets</div>
                    <div class="stat-value">0</div>
                </div>
            </div>

            <h3 style="margin-bottom: 20px;">Recent Orders</h3>
            <div style="overflow-x: auto;">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Product</th>
                            <th>Amount</th>
                            <th>Gmail</th>
                            <th>Discord</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Load orders from LocalStorage
        function loadDashboard() {
            const orders = JSON.parse(localStorage.getItem('prime_orders') || '[]');
            const tbody = document.getElementById('orders-body');
            const totalRevenueEl = document.getElementById('total-revenue');
            const totalOrdersEl = document.getElementById('total-orders');

            let revenue = 0;

            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">No orders yet. Go buy something!</td>
                    </tr>
                `;
            } else {
                // Sort by new
                orders.reverse().forEach(order => {
                    revenue += parseFloat(order.price);
                    const date = new Date(order.date).toLocaleString();

                    const row = `
                        <tr>
                            <td style="font-family: monospace; color: var(--text-secondary);">#${order.id.slice(0, 8)}</td>
                            <td>${order.product}</td>
                            <td>$${order.price}</td>
                            <td>${order.email}</td>
                            <td style="font-size: 0.9rem; color: var(--text-secondary);">${date}</td>
                            <td><span class="status-badge status-paid">Paid</span></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            totalRevenueEl.innerText = '$' + revenue.toFixed(2);
            totalOrdersEl.innerText = orders.length;
        }

        function clearData() {
            if (confirm('Clear all order data?')) {
                localStorage.removeItem('prime_orders');
                loadDashboard();
            }
        }

        // Init
        loadDashboard();

        // Refresh every 5s to simulate "live" updates if tab is open
        setInterval(loadDashboard, 5000);
    </script>
</body>

</html>
