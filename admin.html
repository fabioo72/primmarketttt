<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | PrimeMarket</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            display: block;
        }

        .nav-item {
            display: block;
            padding: 12px 16px;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .nav-item.active,
        .nav-item:hover {
            background: var(--surface-hover);
            color: white;
        }

        .admin-content {
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: var(--radius-md);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .orders-table th,
        .orders-table td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .orders-table th {
            background: var(--surface-hover);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .orders-table tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(234, 179, 8, 0.1);
            color: #facc15;
        }

        .status-paid {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .status-delivered {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

        .status-expired,
        .status-cancelled {
            background: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .login-shell {
            max-width: 420px;
            margin: 15vh auto;
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }
    </style>
</head>

<body>
    <div id="login-view" class="login-shell" style="display:none;">
        <h2 style="margin-bottom:6px;">Admin login</h2>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:20px;">
            Enter your ADMIN_TOKEN to view orders.
        </p>
        <input id="admin-token" type="password" placeholder="Admin token"
            style="width:100%;padding:12px 14px;background:#18181b;border:1px solid var(--border);border-radius:10px;color:white;font-size:0.95rem;margin-bottom:12px;" />
        <button class="btn btn-primary" onclick="saveToken()" style="width:100%;">Continue</button>
        <div id="login-error" style="color:#ff4a4a;font-size:0.85rem;margin-top:12px;display:none;"></div>
    </div>

    <div id="app-view" class="admin-layout" style="display:none;">
        <aside class="sidebar">
            <a href="/" class="sidebar-brand">
                <span class="text-gradient">Prime</span>Admin
            </a>

            <nav>
                <a href="#" class="nav-item active">Orders</a>
                <a href="/status" class="nav-item">Status page</a>
                <a href="#" class="nav-item" onclick="logout();return false;">Log out</a>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="header">
                <h2>Orders</h2>
                <button class="btn btn-outline" onclick="loadOrders()">Refresh</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" id="stat-pending">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Paid — awaiting delivery</div>
                    <div class="stat-value" id="stat-paid">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Delivered</div>
                    <div class="stat-value" id="stat-delivered">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Revenue (EUR, paid+delivered)</div>
                    <div class="stat-value" id="stat-revenue">€0.00</div>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Product</th>
                            <th>Email</th>
                            <th>Amount</th>
                            <th>Coin</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function getToken() { return sessionStorage.getItem('pm_admin_token') || ''; }
        function setToken(t) { sessionStorage.setItem('pm_admin_token', t); }
        function clearToken() { sessionStorage.removeItem('pm_admin_token'); }

        async function saveToken() {
            const t = document.getElementById('admin-token').value.trim();
            const err = document.getElementById('login-error');
            err.style.display = 'none';
            if (!t) { err.textContent = 'Token is required.'; err.style.display = 'block'; return; }
            setToken(t);
            const ok = await tryLoad();
            if (!ok) {
                clearToken();
                err.textContent = 'Unauthorized. Check your token.';
                err.style.display = 'block';
            }
        }

        function logout() { clearToken(); showLogin(); }

        function showLogin() {
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('app-view').style.display = 'none';
        }
        function showApp() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'grid';
        }

        async function tryLoad() {
            const token = getToken();
            if (!token) { showLogin(); return false; }
            try {
                const res = await fetch('/api/admin/orders', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) return false;
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                showApp();
                renderOrders(data.orders || []);
                return true;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        async function loadOrders() { await tryLoad(); }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-body');
            tbody.innerHTML = '';

            let pending = 0, paid = 0, delivered = 0, revenue = 0;
            for (const o of orders) {
                if (o.status === 'pending') pending++;
                if (o.status === 'paid') paid++;
                if (o.status === 'delivered') delivered++;
                if (o.status === 'paid' || o.status === 'delivered') revenue += Number(o.priceEUR) || 0;
            }
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-paid').textContent = paid;
            document.getElementById('stat-delivered').textContent = delivered;
            document.getElementById('stat-revenue').textContent = '€' + revenue.toFixed(2);

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No orders yet.</td></tr>`;
                return;
            }

            for (const o of orders) {
                const date = new Date(o.createdAt).toLocaleString();
                const badgeClass = 'status-' + o.status;
                let action = '';
                if (o.status === 'paid') {
                    action = `<button class="btn btn-primary" style="padding:6px 12px;font-size:0.8rem;" onclick="deliver('${o.id}')">Deliver</button>`;
                } else if (o.status === 'delivered') {
                    action = `<span style="color:var(--text-secondary);font-family:monospace;font-size:0.8rem;">${escapeHtml(o.deliveryCode || '')}</span>`;
                } else {
                    action = '<span style="color:var(--text-secondary);">—</span>';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-family:monospace;">${escapeHtml(o.id)}</td>
                    <td>${escapeHtml(o.product || '')}</td>
                    <td>${escapeHtml(o.email || '')}</td>
                    <td style="font-family:monospace;">${escapeHtml(o.expectedAmount || '')}</td>
                    <td>${escapeHtml(o.coin || '')}</td>
                    <td><span class="status-badge ${badgeClass}">${o.status}</span></td>
                    <td style="color:var(--text-secondary);">${date}</td>
                    <td>${action}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function deliver(id) {
            const code = prompt('Delivery code / credentials for order ' + id + ':');
            if (!code) return;
            try {
                const res = await fetch('/api/admin/deliver', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + getToken(),
                    },
                    body: JSON.stringify({ id, deliveryCode: code }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                await loadOrders();
            } catch (e) {
                alert('Delivery failed: ' + e.message);
            }
        }

        (async () => {
            if (getToken()) {
                const ok = await tryLoad();
                if (!ok) showLogin();
            } else {
                showLogin();
            }
        })();

        setInterval(() => { if (getToken()) tryLoad(); }, 15000);
    </script>
</body>

</html>
